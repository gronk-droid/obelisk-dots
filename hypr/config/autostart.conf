# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Autostart Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/defaults.conf

# Autostart wiki https://wiki.hyprland.org/0.45.0/Configuring/Keywords/#executing #

exec-once = hyprpaper
exec-once = swaybg -o \* -i /home/joy/Pictures/wallpapers/Cloudsday.jpg -m fill
exec-once = waybar &
exec-once = hyprctl dispatch focusmonitor DP-1
exec-once = fcitx5 -d &
exec-once = mako &
exec-once = nm-applet --indicator &
exec-once = bash -c "mkfifo /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob && tail -f /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob | wob -c ~/.config/hypr/wob.ini & disown" &
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &
exec-once = ~/.config/hypr/scripts/sleep.sh
exec-once = playerctld daemon &

# ## Slow app launch fix
exec-once = systemctl --user import-environment &
exec-once = hash dbus-update-activation-environment 2>/dev/null &
exec-once = dbus-update-activation-environment --systemd &
exec-once = nwg-look -a
exec-once = 1password --disable-gpu --disable-software-rasterizer
exec-once = slack --disable-gpu --disable-software-rasterizer
# For polkit-gnome
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# exec-once = ~/.config/.scripts/mount_drives

# ## Idle configuration
exec-once = $idlehandler
