# ┃                     Monitor Configuration                   ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Monitor wiki https://wiki.hyprland.org/0.45.0/Configuring/Monitors/

monitor = DP-1, 2560x1440@239.97Hz, 0x0, 1.0
monitor = DP-2, 3440x1440@99.98Hz, auto-left, 1.0
# monitor = DP-2, 2560x1440@239.97Hz, auto-right, 1.0
# monitor = DP-2, 2560x1440@239.97Hz, 3440x-640, 1.0, transform, 3


#    ╻ ╻┏━┓┏━┓╻┏ ┏━┓┏━┓┏━┓┏━╸┏━╸┏━┓
#    ┃╻┃┃ ┃┣┳┛┣┻┓┗━┓┣━┛┣━┫┃  ┣╸ ┗━┓
#    ┗┻┛┗━┛╹┗╸╹ ╹┗━┛╹  ╹ ╹┗━╸┗━╸┗━┛

# TODO: DP-1 starts on wkspc 2

workspace = 1, m[DP-1]
workspace = 2, m[DP-1]
workspace = 3, m[DP-1]
workspace = 4, m[DP-1]
workspace = 5, m[DP-1]

workspace = 6, m[DP-2]
workspace = 7, m[DP-2]
workspace = 8, m[DP-2]
workspace = 9, m[DP-2]
workspace = 10, m[DP-2]

# If you need to scale ,things like steam etc, please uncomment these lines.
# Adjust GDK_SCALE accordingly to your liking.
xwayland {
 force_zero_scaling = true       # Unscale XWayland
}

# env = GDK_SCALE, 1.25                   # GDK Scaling Factor
